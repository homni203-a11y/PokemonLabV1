<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokemonLab - Hệ Thống Quản Lý</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-biostone">
  <div class="app-container">
    
    <!-- Phần Header: Tiêu đề và Tabs -->
    <header class="header">
      <h1 id="app-title">BIOSTONE</h1>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" role="tab" data-tab="biostone">BIOSTONE</button>
        <button type="button" class="tab" role="tab" data-tab="ultimatestone">ULTIMATESTONE</button>
        <button type="button" class="tab" role="tab" data-tab="chaquestone">CHAQUESTONE</button>
      </nav>
    </header>

    <!-- Phần Nội dung chính -->
    <main class="main-content">
      <div class="action-section">
        <button id="action-btn" class="btn-primary">
          <span class="btn-text">DUNG HỢP GEN</span>
        </button>
      </div>

      <div class="storage-section">
        <h2>KHO LƯU TRỮ GEN POKEMON</h2>
        <div id="pokemon-list" class="pokemon-grid">
          <!-- Danh sách Pokemon sẽ được JavaScript tạo tự động ở đây -->
        </div>
      </div>
    </main>

  </div>
  
  <script src="script.js"></script>
</body>
</html>
