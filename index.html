<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Gen Pokemon V3 - Cyberpunk UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-biom">
    <div class="bg-grid"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="core-icon">
                <svg id="icon-biom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <h1 id="core-title">BIOMNITRIX</h1>
        </div>
        <div class="header-right">
            <button class="nav-btn" onclick="UI.openPokedex()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>POKÉDEX</span>
            </button>
            <button class="nav-btn" onclick="UI.openModal('modal-settings')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>HỆ THỐNG</span>
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- KHU VỰC ĐIỀU KHIỂN (TRÁI) -->
        <section class="col-left active" id="col-left">
            <!-- 3 TABS MỚI -->
            <div class="tabs">
                <button class="tab-btn" data-theme="ultimate" onclick="UI.switchTab('ultimate')">⚡ ULTIMATE</button>
                <button class="tab-btn active" data-theme="biom" onclick="UI.switchTab('biom')">📚 BIOMNITRIX</button>
                <button class="tab-btn" data-theme="chaques" onclick="UI.switchTab('chaques')">🤍 CHAQUETRIX</button>
            </div>

            <div class="tab-content-wrapper">
                <div class="panel-header">
                    <h3 id="panel-title">THIẾT LẬP DUNG HỢP</h3>
                    <button class="dice-btn" onclick="CoreLogic.randomizeAll()" title="Ngẫu nhiên DNA">🎲</button>
                </div>

                <!-- GEN BOX LIST -->
                <div class="gen-list" id="gen-list-container">
                    <!-- DOM sinh ra từ JS -->
                </div>

                <!-- CHAQUETRIX EXTRA UI (Bị ẩn ở Tab khác) -->
                <div id="chaquetrix-module" style="display: none;">
                    <div class="control-group">
                        <label>TỈ LỆ CƠ THỂ</label>
                        <div class="size-scale">
                            <div class="size-step" data-val="1"></div>
                            <div class="size-step" data-val="2"></div>
                            <div class="size-step" data-val="3"></div>
                            <div class="size-step active" data-val="4"></div>
                            <div class="size-step" data-val="5"></div>
                            <div class="size-step" data-val="6"></div>
                            <div class="size-step" data-val="7"></div>
                        </div>
                        <div class="size-label" id="size-label">B.THƯỜNG</div>
                    </div>
                    
                    <div class="control-group" style="margin-top: 15px;">
                        <label>TÍNH CÁCH ĐỒNG HÀNH</label>
                        <div class="grid-options" id="waifu-grid">
                            <button class="grid-btn active" data-desc="Mạnh mẽ, năng động, thích thể thao và bảo vệ bạn.">TOMBOY</button>
                            <button class="grid-btn" data-desc="Bề ngoài lạnh lùng khó tính nhưng bên trong rất quan tâm.">TSUNDERE</button>
                            <button class="grid-btn" data-desc="Sở hữu tình yêu chiếm hữu mãnh liệt, sẵn sàng tiêu diệt kẻ thù của bạn.">YANDERE</button>
                            <button class="grid-btn" data-desc="Quý phái, nhã nhặn, cư xử như một tiểu thư đài các.">THANH LỊCH</button>
                            <button class="grid-btn" data-desc="Quyến rũ, ma mị, hút cạn sinh lực kẻ thù (hoặc của bạn).">MỊ YÊU</button>
                            <button class="grid-btn" data-desc="Trưởng thành, che chở, bao bọc và thường gọi bạn là 'bé cưng'.">MOMMY</button>
                            <button class="grid-btn" data-desc="Dễ đỏ mặt, bẽn lẽn, luôn nấp sau lưng bạn khi gặp nguy hiểm.">NHÚT NHÁT</button>
                            <button class="grid-btn" data-desc="Sành điệu, vui vẻ, thích trêu chọc và theo kịp mọi trend.">GYARU</button>
                        </div>
                        <p class="desc-box" id="waifu-desc">Mạnh mẽ, năng động, thích thể thao và bảo vệ bạn.</p>
                    </div>
                </div>

                <button class="action-btn" onclick="CoreLogic.startSequence()">KÍCH HOẠT QUÁ TRÌNH</button>
            </div>
        </section>

        <!-- KHU VỰC KẾT QUẢ AI (PHẢI) -->
        <section class="col-right" id="col-right">
            <div class="state-view active" id="idle-view">
                <div class="core-anim-container"><div class="pulse-ring"></div></div>
                <p class="status-text">ĐANG CHỜ LỆNH HỆ THỐNG...</p>
            </div>
        </section>
    </main>

    <!-- POKEDEX MODAL -->
    <div id="modal-pokedex" class="modal-overlay">
        <div class="modal-box large-modal">
            <button class="modal-close" onclick="UI.closeModal('modal-pokedex')">&times;</button>
            <h2>POKÉDEX DATABASE</h2>
            <div class="search-wrap">
                <input type="text" id="dex-search" class="cyber-input" placeholder="Nhập tên hoặc ID Pokemon...">
            </div>
            <div id="dex-grid" class="collection-grid">
                <!-- JS Load -->
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="modal-settings" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="UI.closeModal('modal-settings')">&times;</button>
            <h2>HỆ THỐNG</h2>
            <div class="control-group">
                <label>SFX ÂM THANH</label>
                <button id="btn-toggle-sound" class="action-btn" style="margin-top:10px" onclick="SoundFX.toggle()">ĐANG BẬT 🔊</button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="ai-generator.js"></script>
    <script src="main.js"></script>
</body>
</html>
