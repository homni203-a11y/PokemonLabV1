<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Gen Pokemon V2 - Cyberpunk UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-biom">
    <div class="bg-grid"></div>

    <!-- HEADER (Fully Responsive) -->
    <header class="header">
        <div class="header-left">
            <div class="core-icon">
                <!-- Icon Biom -->
                <svg id="icon-biom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <!-- Icon Ultimate (Sấm chớp rỗng) -->
                <svg id="icon-ultimate" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <!-- Icon Chaques (Trái tim rỗng) -->
                <svg id="icon-chaques" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <h1 id="core-title">LÕI ĐÁ BIOM</h1>
        </div>
        <div class="header-right">
            <button class="nav-btn" onclick="UI_MODAL.open('modal-settings')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>CÀI ĐẶT</span>
            </button>
            <button class="nav-btn" onclick="UI_MODAL.showToast('Đấu Trường đang offline 🚧')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M15 3h6v6M10 14L2.1 21.9"/></svg>
                <span>ĐẤU TRƯỜNG</span>
            </button>
            <button class="nav-btn" onclick="UI_MODAL.openCollection()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>SƯU TẬP</span>
            </button>
            <button class="nav-btn" id="btn-cycle-core">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>ĐỔI LÕI</span>
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- CỘT TRÁI -->
        <section class="col-left active" id="col-left">
            <div class="tabs">
                <button class="tab-btn active" data-theme="theme-biom" data-target="tab-biom">BIOM</button>
                <button class="tab-btn" data-theme="theme-ultimate" data-target="tab-ultimate">ULTIMATE</button>
                <button class="tab-btn" data-theme="theme-chaques" data-target="tab-chaques">CHAQUES</button>
            </div>

            <!-- TAB BIOMSTONE -->
            <div class="tab-content active" id="tab-biom">
                <div class="panel-header">
                    <h3>THIẾT LẬP DUNG HỢP</h3>
                    <div class="header-actions">
                        <button class="dice-btn" title="Ghi đè ngẫu nhiên" onclick="AppLogic.rollDice('biom')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
                        </button>
                    </div>
                </div>
                <div class="gen-list" id="biom-gen-list"></div>
                <div class="control-group">
                    <label>CHẾ ĐỘ TRỘN:</label>
                    <div class="toggle-group" id="mix-mode-toggle">
                        <button class="sub-btn active" data-mode="chinh-phu">CHÍNH/PHỤ</button>
                        <button class="sub-btn" data-mode="can-bang">CÂN BẰNG</button>
                    </div>
                    
                    <!-- UI Hiện khi Cân Bằng -->
                    <div id="ui-can-bang" style="display:none; margin-top:10px;">
                        <input type="range" class="cyber-slider" min="0" max="100" value="50">
                        <div class="range-labels"><span>ADN 1 (50%)</span><span>ADN 2 (50%)</span></div>
                    </div>
                    <!-- UI Hiện khi Chính/Phụ -->
                    <div id="ui-chinh-phu" class="toggle-group" style="margin-top:10px;">
                        <button class="sub-btn active" id="btn-main-1">CƠ THỂ CHÍNH: ADN 1</button>
                        <button class="sub-btn" id="btn-main-2">CƠ THỂ CHÍNH: ADN 2</button>
                    </div>
                </div>
                <button class="action-btn" onclick="AppLogic.startProcess('biom')">BẮT ĐẦU DUNG HỢP</button>
            </div>

            <!-- TAB ULTIMATESTONE -->
            <div class="tab-content" id="tab-ultimate">
                <div class="panel-header">
                    <h3>CƠ THỂ GỐC</h3>
                    <div class="header-actions">
                        <button class="dice-btn" onclick="AppLogic.rollDice('ultimate')">
                             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
                        </button>
                    </div>
                </div>
                <div class="gen-list" id="ultimate-gen-list"></div>
                <div class="control-group">
                    <label>TỈ LỆ CƠ THỂ:</label>
                    <input type="range" class="cyber-slider" min="1" max="6" value="3">
                    <div class="range-labels"><span>Micro</span><span>Bình thường</span><span>Khổng lồ</span></div>
                </div>
                <button class="action-btn" onclick="AppLogic.startProcess('ultimate')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;vertical-align:middle;"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    ÉP XUNG TIẾN HÓA
                </button>
            </div>

            <!-- TAB CHAQUESTONE -->
            <div class="tab-content" id="tab-chaques">
                <div class="panel-header">
                    <h3>THỂ GỐC TRIỆU HỒI</h3>
                    <div class="header-actions">
                        <button class="dice-btn" onclick="AppLogic.rollDice('chaques')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
                        </button>
                    </div>
                </div>
                <div class="gen-list" id="chaques-gen-list"></div>
                <div class="control-group">
                    <label>TÍNH CÁCH ĐỒNG HÀNH:</label>
                    <div class="grid-options col-4" id="waifu-grid">
                        <button class="grid-btn active" data-desc="Mạnh mẽ, năng động, luôn bảo vệ bạn trước nguy hiểm.">Tomboy</button>
                        <button class="grid-btn" data-desc="Khó tính bề ngoài nhưng thực ra rất quan tâm.">Tsundere</button>
                        <button class="grid-btn" data-desc="Trưởng thành, che chở, gọi bạn là 'bé cưng'.">Mommy</button>
                        <button class="grid-btn" data-desc="Quyến rũ, ma mị, hút cạn sinh lực.">Mị yêu</button>
                    </div>
                    <p class="desc-box" id="waifu-desc">Mạnh mẽ, năng động, luôn bảo vệ bạn trước nguy hiểm.</p>
                </div>
                <button class="action-btn" onclick="AppLogic.startProcess('chaques')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;vertical-align:middle;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    TRIỆU HỒI ĐỒNG HÀNH
                </button>
            </div>
        </section>

        <!-- CỘT PHẢI -->
        <section class="col-right" id="col-right">
            <!-- Inject DOM từ JS -->
        </section>
    </main>

    <!-- MOBILE NAV -->
    <nav class="bottom-nav">
        <button class="bottom-btn active" id="mobile-tab-lab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v10.5L3 19v2h18v-2l-6-6.5V2"/><path d="M8 2h8"/><path d="M3 15h18"/></svg>
            <span>Phòng Lab</span>
        </button>
        <button class="bottom-btn" id="mobile-tab-result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>Kết Quả</span>
        </button>
    </nav>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- MODAL TÌM KIẾM TOÀN DIỆN (GRID) -->
    <div id="modal-search" class="modal-overlay">
        <div class="modal-box large-modal">
            <button class="modal-close" onclick="UI_MODAL.close('modal-search')">&times;</button>
            <h2>KHO DỮ LIỆU GEN ĐỘT BIẾN</h2>
            <div class="search-wrap">
                <input type="text" id="pokemon-search-input" class="cyber-input" placeholder="Tìm tên hoặc ID...">
                <button class="action-btn search-submit" id="btn-submit-search">TÌM KIẾM</button>
            </div>
            <!-- Grid chọn nhanh -->
            <div id="quick-pick-grid" class="collection-grid" style="margin-top:15px; max-height: 40vh; overflow-y:auto; padding-right:5px;">
                <p style="text-align:center; width:100%; color:#aaa;">Đang tải dữ liệu Gen...</p>
            </div>
        </div>
    </div>

    <!-- CÁC MODAL KHÁC -->
    <div id="modal-settings" class="modal-overlay"><div class="modal-box"><button class="modal-close" onclick="UI_MODAL.close('modal-settings')">&times;</button><h2>CÀI ĐẶT</h2><div class="control-group"><label>ÂM LƯỢNG:</label><input type="range" class="cyber-slider" id="vol-slider" min="0" max="100" value="50"></div></div></div>
    <div id="modal-collection" class="modal-overlay"><div class="modal-box large-modal"><button class="modal-close" onclick="UI_MODAL.close('modal-collection')">&times;</button><h2>BỘ SƯU TẬP</h2><div id="collection-grid" class="collection-grid"></div></div></div>

    <!-- Scripts -->
    <script src="ai-generator.js"></script>
    <script src="script.js"></script>
</body>
</html>
